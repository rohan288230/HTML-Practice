<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application</title>
</head>

<body>
    <h1>Juniior Web Developer Job Application</h1>
    <form>
        <fieldset>
            <legend>Personal Information</legend>
            <p>
                <label for="full-name">Full Name : </label>
                <input type="text" id="full-name" name="full-name" required>
            </p>
            <p>
                <label for="email">Email : </label>
                <input type="email" id="email" name="email" required>
            </p>
            <p>
                <label for="phone">Phone : </label>
                <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="10-digit phone number"
                    required>
            </p>
            <p>
                <label for="dob">Date of Birth : </label>
                <input type="date" id="dob" name="dob">
            </p>
        </fieldset>
        <fieldset>
            <legend for="position">Professional Information</legend>
            <p>
                <label for="position">Position : </label>
                <select id="position" name="position" required>
                    <option value="">Select Position</option>
                    <option value="frontend">Frontend Developer</option>
                    <option value="backend">Backend Developer</option>
                    <option value="fullstack">Full Stack Developer</option>
                </select>
            </p>
            <p>
                <label for="experience">Years of Experience : </label>
                <input type="number" id="experience" name="experience" min="0" max="30" value="0">
            </p>
            <p>
                <label for="salary">Expected Salary : </label>
                <input type="number" id="salary" name="salary" min="0" placeholder="Expected annual salary">
            </p>
            <p>
                <label for="resume">Resume</label>
                <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required>
            </p>
            <p>
                <label for="portfolio">Portfolio URL : </label>
                <input type="url" id="portfolio" name="portfolio" placeholder="https://example.com">
            </p>
        </fieldset>
        <fieldset>
            <legend>Technical Skills</legend>
            <input type="checkbox" id="html" name="skills" value="html">
            <label for="html">HTML</label>
            <input type="checkbox" id="css" name="skills" value="css">
            <label for="css">CSS</label>
            <input type="checkbox" id="javascript" name="skills" value="javascript">
            <label for="javascript">JavaScript</label> 
            <input type="checkbox" id="react" name="skills" value="react">
            <label for="react">React</label>
            <input type="checkbox" id="node" name="skills" value="node">
            <label for="node">Node.js</label>
            <input type="checkbox" id="mongodb" name="skills" value="mongodb">
            <label for="mongodb">MongoDB</label> 
            <input type="checkbox" id="git" name="skills" value="git">
            <label for="git">Git</label>
        </fieldset>
        <fieldset>
            <legend>Education</legend>
            <p>
                <label for="qualification">Highest Qualification : </label>
                <select id="qualification" name="qualification" required>
                    <option value="">Select Qualification</option>
                    <option value="btech">B.Tech</option>
                    <option value="bca">BCA</option>
                    <option value="mca">MCA</option>
                    <option value="other">Other</option>
                </select>
            </p>
            <p>
                <label for="college">College : </label>
                <input type="text" id="college" name="college" required>
            </p>
            <p>
                <label for="graduation-year">Graduation Year : </label>
                <input type="number" id="graduation-year" name="graduation-year" min="2000" max="2025">
            </p>
        </fieldset>
        <fieldset>
            <legend>Availability</legend>
            <p>
                <label for="available-from">Available From : </label>
                <input type="date" id="available-from" name="available-from">
            </p>
            <p>Work Preference : </p>
            <input type="radio" id="remote" name="work_preference" value="remote">
            <label for="remote">Remote</label>
            <input type="radio" id="hybrid" name="work_preference" value="hybrid">
            <label for="hybrid">Hybrid</label>
            <input type="radio" id="onsite" name="work_preference" value="onsite">
            <label for="onsite">On-site</label>
        </fieldset>
        <fieldset>
            <legend>Additional Information</legend>
            <p>
                <label for="cover-message">Cover Message : </label>
            </p>
            <textarea id="cover-message" name="cover-message" rows="6" cols="50" minlength="50" maxlength="1000" placeholder="Tell us why you are suitable for this position."></textarea>
            <p>
                <input type="checkbox" id="aggrement" name="aggrement" value="accepted" required>
                <label for="aggrement">I confirm that the information provided is accurate.</label>
            </p>
        </fieldset>
        <button type="submit">Submit Application</button>
        <button type="reset">Reset Form</button>
    </form>
</body> 

</html>
